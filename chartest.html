<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { makePerson } from './js/engine/character.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8899aa);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dl = new THREE.DirectionalLight(0xfff0e0, 2.0);
dl.position.set(3, 6, 8);
scene.add(dl);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 4.2);
camera.lookAt(0, 1.2, 0);
const cast = [
  { photo: 'assets/faces2/christian.png', top: 0x5a6b42, bottom: 0x3a3a44, hair: 0x6a4a2e, hairStyle: 'short', jacket: true },
  { photo: 'assets/faces2/stacy.png', top: 0x4a7a52, bottom: 0x2c2c34, hair: 0x2e1e14, hairStyle: 'long' },
  { photo: 'assets/faces2/kylie.png', top: 0x5a7ab0, bottom: 0x4a3a30, hair: 0xd8b878, hairStyle: 'long' },
  { photo: 'assets/faces2/olivia.png', top: 0x222226, bottom: 0x222226, hair: 0x16100e, hairStyle: 'long' },
  { photo: 'assets/faces2/olivia2.png', top: 0xd07a92, bottom: 0x777788, hair: 0x241812, hairStyle: 'bun' },
  { photo: 'assets/faces2/mark.png', top: 0x3a5a8a, bottom: 0x2c3a55, hair: 0xc8a060, hairStyle: 'short' },
  { photo: 'assets/faces2/jim.png', top: 0x2c3140, bottom: 0x3c3c44, hair: 0xb8b0a4, hairStyle: 'receding' },
  { photo: 'assets/faces2/tre.png', top: 0x5a6b42, bottom: 0x2c2c34, hair: 0x14100c, hairStyle: 'curly' },
];
cast.forEach((c, i) => {
  const p = makePerson(c);
  p.group.position.set((i - 3.5) * 0.85, 0, 0);
  p.group.rotation.y = 0;
  scene.add(p.group);
});
renderer.render(scene, camera);
setTimeout(() => renderer.render(scene, camera), 1500);
setTimeout(() => renderer.render(scene, camera), 3000);
</script></body></html>
