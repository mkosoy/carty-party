<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Carty Party: A MoCo Holiday</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game-container"></div>

<div id="hud">
  <div id="objective-banner" class="hidden"></div>
  <div id="interact-prompt" class="hidden">E</div>
</div>

<div id="dialogue-box" class="hidden">
  <div style="display:flex;align-items:flex-start;gap:10px"><img id="dialogue-portrait" style="display:none;width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.35);flex:none"><div style="flex:1"><div id="dialogue-speaker"></div>
  <div id="dialogue-text"></div></div></div>
  <div id="dialogue-advance">▼ tap / E</div>
</div>

<div id="phone-overlay" class="hidden">
  <div id="phone-caller"></div>
  <div id="phone-status">incoming call…</div>
</div>

<div id="choice-box" class="hidden"></div>

<div id="touch-controls">
  <div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
  <div id="action-button">E</div>
  <div id="jump-button">⤒</div>
</div>

<div id="title-screen">
  <canvas id="title-snow"></canvas>
  <div id="title-inner">
    <div id="title-lights"></div>
    <p class="title-kicker">a game for the county</p>
    <h1><span>Carty</span> <span>Party</span></h1>
    <h2>~ A MoCo Holiday ~</h2>
    <div id="title-cast">
      <div class="cast-chip"><img src="assets/portraits/christian.png" alt="Christian"><span>Christian</span></div>
      <div class="cast-chip"><img id="cast-stacy" src="assets/portraits/stacy.png" alt="Stacy"><span>Stacy</span></div>
      <div class="cast-chip"><img id="cast-olivia" src="assets/portraits/olivia.png" alt="Olivia"><span>Olivia ×2</span></div>
      <div class="cast-chip"><img id="cast-kylie" src="assets/portraits/kylie.png" alt="Kylie"><span>Kylie ❤️</span></div>
      <div class="cast-chip"><img id="cast-mark" src="assets/portraits/mark.png" alt="Mark"><span>Mark</span></div>
    </div>
    <button id="start-button">✈ Land at Dulles</button>
    
    <div id="minigames-section">
      <p class="mg-title">— minigames —</p>
      <div id="minigames-row">
        <button class="mg-btn" data-scene="dentist"><img class="mg-emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/72x72/1f9b7.png" alt="tooth"><span>Dr. Fritz's Office</span></button>
        <button class="mg-btn" data-scene="runclub"><img class="mg-emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/72x72/1f3c3.png" alt="run"><span>Kylie's Run Club</span></button>
        <button class="mg-btn" data-scene="miami"><img class="mg-emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/72x72/1faa9.png" alt="disco"><span>E11EVEN Miami</span></button>
        <button class="mg-btn" data-scene="swap"><img class="mg-emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/72x72/1f3a7.png" alt="dj"><span>DJ at the Swap</span></button>
      </div>
    </div>
    <p class="title-sub">Dulles → MoCo → Yo Yogi → the swap → DC<br>
    <span class="title-small">WASD / joystick to move · E to interact · best with sound on</span></p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
